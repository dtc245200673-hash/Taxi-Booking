
services:
  
  promtail:
    image: grafana/promtail:3.5.0
    container_name: taxi-promtail
    restart: unless-stopped
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - taxi_logs:/var/log/taxi:ro
    depends_on:
      - loki
    networks:
      - taxi-network

  
  loki:
    image: grafana/loki:3.5.0
    container_name: taxi-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - taxi-network

  
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.53.0
    container_name: taxi-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - taxi-network

  
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: taxi-nginx-exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://web:8081/stub_status"
    depends_on:
      - web
    networks:
      - taxi-network

  
  
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: taxi-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: "postgres:5432/taxi_booking?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi-network


  
  grafana:
    image: grafana/grafana:12.1.0
    container_name: taxi-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - taxi-network

  
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: taxi-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
      - "--storage.tsdb.retention.size=1GB"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend
    networks:
      - taxi-network

  web:
    build:
      context: ./frontend
    container_name: taxi-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - taxi-network

  
  backend:
    build:
      context: ./backend
    container_name: taxi-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

    volumes:
      - taxi_logs:/app/logs
    networks:
      - taxi-network

  postgres:
    image: postgres:16-alpine
    container_name: taxi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - taxi-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taxi-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - taxi-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  loki_data:
  taxi_logs:

networks:
  taxi-network:
    driver: bridge
